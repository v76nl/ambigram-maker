<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アンビグラム研究 論文・コード解読リーダー (Paper & Code Inspector)</title>
  
  <!-- Google Fonts: Zen Maru Gothic, BIZ UDPGothic, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- KaTeX for beautiful math equations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  
  <!-- Reader Stylesheet -->
  <link rel="stylesheet" href="reader.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="reader-header">
    <div class="brand-section">
      <svg class="brand-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 12a8 8 0 0 1 14.93-4"></path>
        <path d="M20 12a8 8 0 0 1-14.93 4"></path>
        <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
      </svg>
      <span class="brand-label">Ambigram Inspector</span>
    </div>

    <!-- Paper & Code Switch Tabs -->
    <nav class="paper-tabs" aria-label="コンテンツ選択">
      <button class="tab-btn active" data-paper-id="paper05">
        <svg class="tab-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <span class="tab-label-main">論文 05 (魏・山口)</span>
      </button>
      <button class="tab-btn" data-paper-id="paper02">
        <svg class="tab-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span class="tab-label-main">論文 02 (井上・高橋)</span>
      </button>
      <button class="tab-btn" data-paper-id="app_code">
        <svg class="tab-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        <span class="tab-label-main">アプリ実装コード</span>
      </button>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <button id="toggle-code-filter-btn" class="filter-toggle-btn" title="本アプリの実装に関わる用語だけをハイライト">
        <svg class="action-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>実装対応のみ</span>
      </button>
      <span id="progress-pill" class="progress-pill">習得 0/14</span>
    </div>
  </header>

  <!-- Workspace: 3 Columns -->
  <main class="reader-workspace">
    
    <!-- 1. Left: TOC Navigation -->
    <aside class="toc-sidebar" aria-label="目次">
      <div class="toc-header">目次</div>
      <ul id="toc-list" class="toc-list">
        <!-- JSで動的生成 -->
      </ul>
    </aside>

    <!-- 2. Center: Document Scroll Area -->
    <section id="content-scroll-area" class="content-scroll-area">
      <article id="paper-sheet" class="paper-sheet">
        <!-- JSで動的レンダリング -->
      </article>
    </section>

    <!-- 3. Right: Inspector Panel -->
    <aside id="inspector-sidebar" class="inspector-sidebar" aria-label="用語・コードインスペクター">
      <div class="inspector-empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <div class="empty-title">用語・数式をクリックして解読</div>
        <p class="empty-hint">
          本文中の青または橙色のハイライト用語をクリックすると、<br>
          <strong>「日常の直感たとえ話」</strong> と <strong>「このアプリのコード実装との対応」</strong> がここに表示されます。
        </p>
      </div>
    </aside>

  </main>

  <!-- Floating Tooltip -->
  <div id="floating-tooltip" class="floating-tooltip" role="tooltip"></div>

  <!-- Scripts -->
  <script src="annotations.js"></script>
  <script src="papers_content.js"></script>
  <script src="code_content.js"></script>
  <script src="reader.js"></script>
</body>
</html>
